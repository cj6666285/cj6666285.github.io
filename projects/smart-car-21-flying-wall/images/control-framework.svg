<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">二十一届智能车飞檐走壁：控制框架示意图</title>
<desc id="desc">五路电磁传感器、陀螺仪和编码器经过数据处理、赛道元素状态机、方向 PID 与速度 PID，输出左右轮 PWM。示意图不代表实物照片。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172b20"/><stop offset="1" stop-color="#070e0d"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#85ab6b" stroke-opacity=".09"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#a1d77b"/></marker></defs>
<rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/>
<g font-family="Microsoft YaHei, sans-serif"><text x="68" y="85" fill="#8caa79" font-size="17" letter-spacing="4">SMART CAR / CONTROL FRAMEWORK</text><text x="68" y="157" fill="#e1ecd7" font-size="44" font-weight="700">二十一届智能车飞檐走壁</text><text x="68" y="201" fill="#b5cd9c" font-size="19">电磁循迹 · 双轮差速闭环 · 赛道元素状态机</text>
<g fill="#112118" stroke="#7da65b" stroke-width="1.5"><rect x="68" y="270" width="260" height="190" rx="13"/><rect x="465" y="270" width="260" height="190" rx="13"/><rect x="862" y="270" width="270" height="190" rx="13"/></g>
<g fill="#c2ff6b" font-size="15" letter-spacing="2"><text x="93" y="308">01 / SENSOR INPUT</text><text x="490" y="308">02 / CONTROL</text><text x="887" y="308">03 / ACTUATION</text></g>
<g fill="#d8e5cc" font-size="24"><text x="93" y="360">五路电磁传感器</text><text x="490" y="360">方向 PID + 阻尼</text><text x="887" y="360">左右轮速度 PID</text></g>
<g fill="#92ab80" font-size="18"><text x="93" y="404">陀螺仪 / 左右编码器</text><text x="490" y="404">偏差 → 目标差速</text><text x="887" y="404">速度前馈 → PWM</text></g>
<g stroke="#a1d77b" stroke-width="2" marker-end="url(#arrow)"><path d="M340 365h108"/><path d="M737 365h108"/></g>
<rect x="68" y="513" width="1064" height="93" rx="12" fill="#afdd6a" fill-opacity=".05" stroke="#597e44"/><text x="94" y="551" fill="#c1dca9" font-size="22">5 ms 控制周期</text><text x="94" y="581" fill="#92ab80" font-size="17">采集 → 滤波与归一化 → 状态判断 → 方向控制 → 速度闭环 → 电机输出</text>
<text x="68" y="666" fill="#708c60" font-size="14" letter-spacing="2">ALGORITHM NOTES / 控制框架示意</text><circle cx="1125" cy="661" r="5" fill="#c2ff6b"/></g>
</svg>
